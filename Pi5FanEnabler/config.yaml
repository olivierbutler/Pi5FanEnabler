name: "Pi 5 Fan Enabler"
version: "0.9"
slug: "pi5enableraddon"
description: "This enables the fan on the Raspberry Pi 5 when running Home Assistant OS. You can uninstall this when it has run once. Check logs for information."
arch:
  - aarch64
startup: "once"
auth_api: true
init: false
ingress: true
app_armor: false
privileged:
  - SYS_ADMIN
stage: "stable"
full_access: true
url: "https://github.com/olivierbutler/Pi5FanEnabler"
boot: "manual"
options:
  fan_temp0: 35
  fan_temp0_speed: 75
  fan_temp0_hyst: 5
  fan_temp1: 50
  fan_temp1_speed: 125
  fan_temp1_hyst: 5
  fan_temp2: 60
  fan_temp2_speed: 175
  fan_temp2_hyst: 5
  fan_temp3: 65
  fan_temp3_speed: 250
  fan_temp3_hyst: 5
schema:
  fan_temp0: int
  fan_temp0_speed: int
  fan_temp0_hyst: int
  fan_temp1: int
  fan_temp1_speed: int
  fan_temp1_hyst: int
  fan_temp2: int
  fan_temp2_speed: int
  fan_temp2_hyst: int
  fan_temp3: int
  fan_temp3_speed: int
  fan_temp3_hyst: int
